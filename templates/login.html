<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — {{ app_title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <link rel="icon" href="{{ url_for('logo') }}">
</head>
<body>
<div class="centered">
  <div class="auth-card">
    <div class="auth-top">
      <img class="rail-mark" src="{{ url_for('logo') }}" alt="" width="34" height="34">
      <div>
        <div class="rail-name">{{ app_title }}</div>
        <div class="rail-sub">Проверка студенческих отчётов</div>
      </div>
    </div>

    <form class="auth-body" method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

      {% if error %}
      <div class="note bad" style="margin:0;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3.5L1.8 20.5h20.4z"/><path d="M12 10v4.4M12 17.6v.1"/></svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <div class="field">
        <label for="username">Логин</label>
        <input type="text" id="username" name="username" autocomplete="username"
               autofocus value="{{ username or '' }}" required>
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn primary" type="submit">Войти</button>
      <p class="hint" style="margin:0;text-align:center;">
        Забыли пароль — обратитесь к администратору системы.
      </p>
    </form>

    <div class="auth-foot">
      <b>{{ app_title }}</b>
      <ul class="acronym">
        {% for letter, word in brand.ACRONYM %}
        <li><b>{{ letter }}</b>{{ word[1:] }}</li>
        {% endfor %}
      </ul>
      <div class="team-line"><b>{{ brand.TEAM }}</b></div>
    </div>
  </div>
</div>
</body>
</html>
