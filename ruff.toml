# Линтер. Набор правил намеренно узкий: в проекте свой сложившийся стиль –
# выровненные по столбцу присваивания, короткие однострочные `if`, длинные
# комментарии-объяснения, – и переписывать его под умолчания линтера значило бы
# менять код ради инструмента. Здесь остаются правила, которые находят ошибки,
# а не расхождения во вкусах.
line-length = 100
target-version = "py311"
extend-exclude = ["memory", "reports", "uploads"]

[lint]
# F  – pyflakes: неиспользуемые импорты и переменные, необъявленные имена
# E9 – синтаксис и ошибки, из-за которых файл не запустится
# B  – bugbear: изменяемые значения по умолчанию, потерянные исключения и т.п.
# UP – конструкции, устаревшие для заявленной версии Python
select = ["F", "E9", "B", "UP"]
ignore = [
    # zip(..., strict=) меняет поведение на списках разной длины, а вызовы в
    # db.py и sqlmigrate.py сопоставляют колонки со значениями, где расхождение
    # уже отловлено выше.
    "B905",
    # `raise ... from err` в convert.py: исходное исключение LibreOffice в
    # сообщение уже вложено, а вторая трассировка в журнале только мешает.
    "B904",
]

[lint.per-file-ignores]
# Тесты обращаются к внутренним функциям проверок намеренно: правила ГОСТа
# разложены по _check_*-функциям, и проверять их через публичный check_gost
# значило бы каждый раз собирать целый отчёт.
"tests/*" = ["F401"]
