name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: mxd3v-tech/alena

jobs:
  # Отдельный прогон тестов перед публикацией. Он дублирует workflow «tests»,
  # и это намеренно: связывать два workflow через workflow_run значит собирать
  # образ по определению из ветки по умолчанию и терять отчёт о причине отказа.
  # Набор идёт треть секунды – дешевле, чем выложенный сломанный образ.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # В форке секретов Docker Hub нет, и job упал бы на входе.
    if: github.repository_owner == 'mxd3v-tech'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest – с ветки по умолчанию; версии – с тега v1.2.3; короткий sha
          # остаётся всегда, чтобы можно было откатиться на конкретный коммит.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Слои с LibreOffice и шрифтами Microsoft весят под гигабайт и почти
          # не меняются – без кеша каждая сборка тянула бы их заново.
          cache-from: type=gha
          cache-to: type=gha,mode=max
