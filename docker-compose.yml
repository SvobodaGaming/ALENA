services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-au}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-au}
      POSTGRES_DB: ${POSTGRES_DB:-au_reports}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-au} -d ${POSTGRES_DB:-au_reports}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./reports:/app/reports   # generated HTML reports survive restart
      - ./memory:/app/memory     # JSON fingerprint store (fallback when DB is off)
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://au:au@db:5432/au_reports}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
