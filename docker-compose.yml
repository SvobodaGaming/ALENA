services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-au}
      # Пароля по умолчанию нет намеренно: `au` уезжал в рабочие установки как
      # есть. Без POSTGRES_PASSWORD в .env compose откажется стартовать.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-au_reports}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-au} -d ${POSTGRES_DB:-au_reports}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./reports:/app/reports   # generated HTML reports survive restart
      - ./memory:/app/memory     # JSON fingerprint store (fallback when DB is off)
    env_file:
      - .env
    environment:
      # Строка подключения берётся из .env как есть. Запасного значения здесь
      # больше нет: прежнее «:-postgresql://au:au@db…» и подставляло пароль по
      # умолчанию, и ломало обещанный откат на JSON — пустой DATABASE_URL в
      # .env заменялся на эту строку, и приложение всё равно уходило в
      # PostgreSQL. Одинарный дефис оставляет пустое значение пустым.
      DATABASE_URL: ${DATABASE_URL-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
