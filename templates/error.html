<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доступ закрыт – {{ app_title }}</title>
  {# Тема – до первой отрисовки, чтобы страница не мигала светлой. #}
  <script>try{var t=localStorage.getItem('alena-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preload" href="{{ url_for('static', filename='fonts/manrope-cyrillic.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ url_for('static', filename='fonts/manrope-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ asset('app.css') }}">
  <link rel="icon" href="{{ logo_url() }}">
</head>
<body>
<div class="centered">
  <div class="auth-card">
    <div class="auth-top">
      <img class="rail-mark" src="{{ logo_url() }}" alt="" width="34" height="34">
      <div>
        <div class="rail-name">Ошибка {{ code }}</div>
        <div class="rail-sub">Действие не выполнено</div>
      </div>
    </div>
    <div class="auth-body">
      <p style="margin:0;font-size:13px;">{{ message }}</p>
      <a class="btn primary" style="justify-content:center;" href="{{ url_for('index') }}">К проверкам</a>
    </div>
    <div class="auth-foot">
      <b>{{ app_title }}</b>
      <ul class="acronym">
        {% for letter, word in brand.ACRONYM %}
        <li><b>{{ letter }}</b>{{ word[1:] }}</li>
        {% endfor %}
      </ul>
      <div class="team-line"><b>{{ brand.TEAM }}</b></div>
    </div>
  </div>
</div>
</body>
</html>
